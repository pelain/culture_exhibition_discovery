# 전시 피드를 매일 새로 만들어 GitHub Pages 로 내보낸다 (개인정보처리방침·소개 페이지와 함께).
# 앱(한국을 보다)은 https://pelain.github.io/culture_exhibition_discovery/feed.json 과 programs.json 을 받아 쓴다.
#  - Settings → Pages → Source 가 "GitHub Actions" 여야 한다.
#  - 공공데이터포털 키는 Settings → Secrets and variables → Actions 에 DATA_GO_KR_KEY 로 넣는다 (없어도 돌지만 전시 수가 줄어든다).
#  - 피드 만들기가 실패하면(전시를 5건도 못 모으면) 저장소에 있는 마지막 site/feed.json 을 그대로 내보낸다.
name: feed

on:
  schedule:
    - cron: "10 18 * * *" # 매일 03:10 KST (앱의 새벽 자동 받기보다 먼저)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 내려받은 원본(전시 상세, 좌표)을 다음 실행에서 다시 쓴다. 출처 서버에 보내는 요청이 줄어든다.
      - uses: actions/cache@v4
        with:
          path: tools/cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-
      - run: cp -r site public
      - name: build feed
        # push 로 돌 때는 페이지만 바꾼 것이므로 피드를 새로 만들지 않는다.
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 tools/build_feed.py --out public --no-asset
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
